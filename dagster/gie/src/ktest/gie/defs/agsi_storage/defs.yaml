type: ktest.gie.components.gie_component.GieComponent

attributes:
  dataset: agsi
  # AGSI publishes historical data from 2011 on
  start_date: "2011-01-01"
  end_offset: 0
  # a gas day is published in the evening after it ended, corrections
  # follow later
  refresh_cron: "0 21 * * *"
  refresh_lookback_days: 14
  spec:
    key: gie/agsi_storage
    description: >
      GIE AGSI gas storage, one row per storage facility and gas day, all
      countries on the platform. Natural key: (gas_day, country_code,
      company_eic, facility_eic); the facility EIC alone is not unique
      (GB and GB* list the same facilities).
    group_name: gie
    kinds: ["iceberg"]
