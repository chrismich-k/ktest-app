[project]
name = "ktest-smard"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.24",
    "dagster-iceberg>=0.3.14",
    "httpx>=0.28.1",
    "pyiceberg[hive]>=0.11.1",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "ktest.smard"
registry_modules = [
    "ktest.smard.components.*",
]
