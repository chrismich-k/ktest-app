[project]
name = "ktest-osm"
requires-python = ">=3.11,<3.15"
version = "0.1.0"
# dagster-aws is needed even without S3 resources: the run pods use this
# image and the instance's S3ComputeLogManager.
dependencies = [
    "brotli>=1.1",
    "dagster==1.13.24",
    "dagster-aws>=0.29.24",
    "dagster-iceberg>=0.3.14",
    "dagster-postgres>=0.29.24",
    "httpx>=0.28.1",
    "pyiceberg[hive]>=0.11.1",
    "pyogrio>=0.9",
    "shapely>=2.1",
]

[dependency-groups]
dev = ["dagster-dg-cli", "dagster-webserver", "ruff", "ty"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ktest"]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "ktest.osm"

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"
