version: 2

models:
  - name: stg_smard__realisierte_erzeugung
    description: SMARD realised generation, quarter-hourly, per region and data series.
    columns:
      - name: measured_at
        data_tests:
          - not_null
      - name: region
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [measured_at, region, data_id]
