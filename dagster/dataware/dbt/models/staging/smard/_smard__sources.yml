version: 2

sources:
  - name: smard
    description: >
      Raw SMARD market data, written as Iceberg tables by the `smard`
      Dagster code location (asset keys `smard/<category>_<sub>_<resolution>`).
    database: "{{ env_var('DATAWARE_TRINO_CATALOG') }}"
    schema: "{{ env_var('DATAWARE_SMARD_SCHEMA') }}"
    # Table names start with a digit, so they must be quoted in Trino.
    quoting:
      identifier: true
    tables:
      - name: 1_1_quarterhour
        description: Stromerzeugung / Realisierte Erzeugung (quarterhour)
        columns:
          - name: timestamp
            data_tests:
              - not_null
          - name: region
            data_tests:
              - not_null
          - name: data_id
          - name: value
