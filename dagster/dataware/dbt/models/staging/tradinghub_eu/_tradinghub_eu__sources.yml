version: 2

sources:
  - name: tradinghub_eu
    description: >
      Raw Trading Hub Europe DataExport tables, written as Iceberg tables by
      the `tradinghub_eu` Dagster code location (asset keys
      `tradinghub_eu/<Endpoint>`).
    database: "{{ env_var('DATAWARE_TRINO_CATALOG') }}"
    schema: "{{ env_var('DATAWARE_TRADINGHUB_EU_SCHEMA') }}"
    tables:
      - name: externalbalancinggas
        meta:
          dagster:
            # asset key of the Dagster import asset (differs in case from
            # the Iceberg table name)
            asset_key: ["tradinghub_eu", "ExternalBalancingGas"]
        description: >
          External balancing gas actions of THE per gas day. `gasday` and
          `timestampactivation` are naive local timestamps (Europe/Berlin);
          a gas day runs from 06:00 to 06:00 local time of the next day.
        columns:
          - name: gasday
            data_tests:
              - not_null
          - name: timestampactivation
            data_tests:
              - not_null

      - name: resultslongtermtenders
        meta:
          dagster:
            asset_key: ["tradinghub_eu", "ResultsLongTermTenders"]
        description: >
          Results of THE's long-term balancing tenders (LTO RoD/Hour, Short
          Call Balancing Services, Flexibility Services), from an
          undocumented website JSON endpoint. One row per awarded lot;
          identical rows are separate lots. `start`/`ende` are naive local
          timestamps (Europe/Berlin), gas-day aligned (06:00).
        columns:
          - name: start
            data_tests:
              - not_null
          - name: ende
            data_tests:
              - not_null
          - name: leistungspreis
            description: Capacity price in € for the whole option period.
            data_tests:
              - not_null
