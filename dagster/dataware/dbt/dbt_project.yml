name: dataware
version: "0.1.0"
config-version: 2

profile: dataware

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

models:
  dataware:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      # only feeds the marts, which are materialized themselves
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    api:
      # read interface for the web API, decoupled from the star schema so
      # the serving store can change later without touching the frontend
      +materialized: view
      +schema: api

seeds:
  dataware:
    +schema: seeds

flags:
  # verify Trino's TLS certificate (dbt-trino's legacy default is not to)
  require_certificate_validation: true
