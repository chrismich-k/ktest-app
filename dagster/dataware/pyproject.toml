[project]
name = "dataware"
requires-python = ">=3.11,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.25",
    "dagster-aws>=0.29.24",
    "dagster-iceberg>=0.3.14",
    "dagster-postgres>=0.29.24",
    "dagster-dbt",
    "httpx>=0.28.1",
    "pyiceberg[hive]>=0.11.1",
    "dbt-core>=1.10,<2",
    "dbt-trino>=1.10.6",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ktest"]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "ktest.dataware"
registry_modules = [
    "ktest.dataware.components.*",
]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"
