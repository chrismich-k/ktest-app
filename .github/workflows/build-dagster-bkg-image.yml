name: Build and Push Dagster bkg Code Location Image

on:
  push:
    branches:
      - main
    paths:
      - dagster/bkg/**
      - .github/workflows/build-dagster-bkg-image.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/dagster-bkg

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,priority=900

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./dagster/bkg
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      # ktest-argocd: clusters/hetzner-ktest-juno/dagster/bkg (own ArgoCD
      # Application); the base (ktest-gitops) names the image
      # "dagster-code-location"
      - name: Update GitOps Repository
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          # short commit SHA tag (e.g. sha-a1b2c3d) from the meta outputs
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/chrismich-k/ktest-argocd.git gitops
          cd gitops

          FULL_IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          (cd clusters/hetzner-ktest-juno/dagster/bkg \
            && kustomize edit set image "dagster-code-location=${FULL_IMAGE_NAME}:${IMAGE_TAG}")

          if git diff --quiet; then
            echo "Image tag unchanged."
            exit 0
          fi
          git add clusters/hetzner-ktest-juno/dagster/bkg
          git commit -m "chore(gitops): update dagster-bkg image to ${IMAGE_TAG} [skip ci]"
          # other build workflows may push to the same repo at the same time
          for attempt in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          exit 1
